function showHmi(){modal('PLANET EV-TC / 교육용 HMI',`<div class="hmiLayout"><div class="hmi"><div class="hstat"><span>시스템 상태　<b data-val="status">대기</b></span><span data-val="time">08:30:00</span></div><div class="tools"><button data-hmi-cmd="batch"><i>▤</i>배치 입력</button><button data-hmi-cmd="start"><i>▶</i>검사 시작</button><button data-hmi-cmd="stop"><i>■</i>검사 중지</button><button data-hmi-cmd="image"><i>▣</i>이미지 보기</button><button data-hmi-cmd="settings"><i>⚙</i>설정</button><button data-hmi-cmd="exit"><i>×</i>나가기</button></div><div class="hmigrid"><div><h4>불량·이미지 정보</h4><div class="camText">CAM <select id="camSelect" style="font-size:10px;padding:1px">${Array.from({length:12},(_,i)=>`<option>${i+1}</option>`).join('')}</select> · 합성 교육 이미지</div><canvas id="camCanvas" width="360" height="340"></canvas><div class="camText" id="camCaption">이송 위치 확인</div></div><div><h4>검사 정보</h4><table><tr><td>품명</td><td data-val="product"></td></tr><tr><td>LOT</td><td data-val="lot"></td></tr><tr><td>검사속도</td><td><b data-val="speed"></b> T/H</td></tr><tr><td>수율*</td><td><b data-val="yield"></b>%</td></tr></table><h4>수량 정보</h4><table><tr><td>전체</td><td data-val="all"></td></tr><tr><td>양품</td><td data-val="good" style="color:#80ec9c"></td></tr><tr><td>불량</td><td data-val="bad" style="color:#ff797e"></td></tr><tr><td>미검사</td><td data-val="un" style="color:#ebd483"></td></tr></table></div></div><div class="pies"><canvas id="pie" width="230" height="140"></canvas><canvas id="rates" width="230" height="140"></canvas></div><div class="hfoot">검사속도 (Tablet/Hour)</div><canvas id="trend" width="600" height="180"></canvas><div class="hfoot">* 양품 / (양품+불량), 미검사 제외 · 전체 회수비율과 구분</div></div><div class="hmiSide"><div class="stepnum">OPERATION / ${preview?'관찰':esc(SOURCE_STEPS[model.s.step].name)}</div><h3>장비 상태와 같은 값입니다.</h3><p>SP는 설정, PV는 모의 구동 응답입니다. 이미지와 검사값은 실제 영상 분석 결과가 아니라 교육용으로 생성됩니다.</p>${model.s.step===4?fields('numeric'):fields('speed')}<div class="card"><h3>현재 진행</h3><p>촬영 1차 <b data-val="cap1"></b>/100 × 12대<br>촬영 2차 <b data-val="cap2"></b>/100 × 2대<br>현재 구간 미검률 <b data-val="rate"></b>%</p><button class="small" data-hmi-cmd="closecover">커버 닫기</button><button class="small" data-hmi-cmd="resume">검사 재개</button></div><p class="tip warn">표시값·단위·배치 ID는 교육 상태입니다. 자료의 SOP는 Draft이고 이 화면은 검증된 GMP 전자기록이 아닙니다.</p></div></div>`,'hmi');}
function drawHmi(){const c=$('#camCanvas');if(!c)return;const s=current(),x=c.getContext('2d'),w=c.width,h=c.height,unstable=s.testResult==='unstable'||(s.step===4&&Math.abs(s.numeric.center)>.2),dx=unstable?45*Math.sin(previewTime*2):0;
 x.fillStyle='#060d15';x.fillRect(0,0,w,h);x.strokeStyle='#526879';x.lineWidth=9;x.beginPath();x.moveTo(0,h*.70);x.lineTo(w,h*.70);x.stroke();x.strokeStyle='#237b4c';x.lineWidth=1;x.strokeRect(w*.23,h*.22,w*.54,h*.59);
 let g=x.createRadialGradient(w*.43+dx,h*.42,8,w*.5+dx,h*.5,65);g.addColorStop(0,'#f6eafa');g.addColorStop(.7,'#d7c7e4');g.addColorStop(1,'#887d9f');x.fillStyle=g;x.beginPath();x.ellipse(w*.5+dx,h*.51,65,63,.06,0,Math.PI*2);x.fill();x.strokeStyle='#aa99b8';x.lineWidth=2;x.beginPath();x.moveTo(w*.5-30+dx,h*.51);x.lineTo(w*.5+30+dx,h*.51);x.stroke();
 if(s.step>=6){x.strokeStyle='#85d0be';x.lineWidth=5;x.beginPath();x.moveTo(w*.5-32+dx,h*.51);x.lineTo(w*.5+32+dx,h*.51);x.stroke();}
 if(s.fault){x.fillStyle='#d6c6e1';x.beginPath();x.ellipse(w*.78,h*.51,60,62,0,0,Math.PI*2);x.fill();x.strokeStyle='#eeba79';x.strokeRect(w*.20,h*.22,w*.70,h*.60);}
 x.fillStyle='#9cbac8';x.font='14px sans-serif';x.fillText('CAM '+($('#camSelect')?.value||'1')+' · 교육 이미지',12,h-15);$('#camCaption').textContent=s.fault?'미검사: 붙은 정제 (가상 상황)':unstable?'센터 편차: 수치 변경 후 재시험':'중앙 안착 · 위치 확인';
 const p=$('#pie'),px=p.getContext('2d');px.fillStyle='#282854';px.fillRect(0,0,p.width,p.height);let counts=[s.batch.good,s.batch.bad,s.batch.un],cols=['#70cc92','#e57888','#e3c975'],sum=counts.reduce((a,b)=>a+b,0)||1,a=-Math.PI/2;counts.forEach((v,i)=>{let b=a+Math.PI*2*v/sum;px.beginPath();px.moveTo(65,72);px.arc(65,72,48,a,b);px.fillStyle=cols[i];px.fill();a=b;px.font='12px sans-serif';px.fillText(['양품','불량','미검'][i]+' '+v.toLocaleString(),123,47+i*26);});
 const r=$('#rates'),rx=r.getContext('2d');rx.fillStyle='#282854';rx.fillRect(0,0,r.width,r.height);rx.fillStyle='#d5dcec';rx.font='12px sans-serif';rx.fillText('현재 구간 미검률',16,27);rx.fillStyle='#c29666';rx.fillRect(18,46,195*Math.min(1,s.windowRate/8),20);rx.fillStyle='#f8e1b3';rx.font='20px sans-serif';rx.fillText(s.windowRate.toFixed(2)+' %',18,106);
 const t=$('#trend'),tx=t.getContext('2d');tx.fillStyle='#202847';tx.fillRect(0,0,t.width,t.height);tx.strokeStyle='#424e6b';tx.lineWidth=1;for(let y=30;y<t.height;y+=30){tx.beginPath();tx.moveTo(0,y);tx.lineTo(t.width,y);tx.stroke();}for(let v=60;v<t.width;v+=60){tx.beginPath();tx.moveTo(v,0);tx.lineTo(v,t.height);tx.stroke();}tx.strokeStyle='#a4ded2';tx.lineWidth=2;tx.beginPath();history.forEach((v,i)=>{let a=i/Math.max(1,history.length-1)*t.width,b=t.height-15-v/60000*(t.height-30);i?tx.lineTo(a,b):tx.moveTo(a,b);});tx.stroke();}
function reportHtml(){const s=model.s,t=model.totals();return `<!doctype html><html lang="ko"><meta charset="utf-8"><title>EVTC 학습 보고서</title><style>body{max-width:980px;margin:40px auto;font:14px/1.6 'Malgun Gothic',sans-serif;color:#173340}h1{border-bottom:3px solid #388674;padding-bottom:12px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #9badb4;padding:8px;text-align:left}pre{white-space:pre-wrap;font:12px/1.6 sans-serif}.warn{padding:12px;background:#fff1d4}section{break-inside:avoid;margin:25px 0}</style><h1>PLANET EV-TC / 선별 3D 학습 보고서</h1><p>${VERSION} · ${esc(s.recipe?.lot||'교육 세션')} · 진행 ${stepNumber(s.step)}/${STEP_COUNT}</p><p class="warn">교육용 모의 기록입니다. SOP-EQM-00299 v1.1 업로드본은 Draft/유효하지 않음으로 표시되어 있습니다. 실제 제조기록·전자서명·작업자격을 대신하지 않습니다.</p><section><h2>배치 수량 대조</h2><table>${Object.entries(t).map(([k,v])=>`<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</table><p>본검사 원본 수량과 미선별 재선별 결과를 별도로 보존했습니다. 불량 재선별은 타 선별기에서 수행하므로 EV 합계는 본검사 양품과 미선별 재검 양품만 포함합니다. 본검사 불량은 별도 보관 수량입니다.</p></section>${legacyScopeHtml(s)}<section><h2>챌린지 결과</h2><pre>${esc(JSON.stringify(s.challengeResults,null,2))}</pre></section>${s.records.map(r=>`<section><h3>${r.id}. ${esc(r.title)} · ${fmt(r.at)}</h3><pre>${esc(JSON.stringify(r.value,null,2))}</pre></section>`).join('')}<p>방 배치: 사용자 도면의 상대 위치. 부품 치수·내부 숨은 배출 경로·이송 물리 모델은 교육용 근사입니다.</p></html>`;}
function download(text,name,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);}
function exportFile(kind){if(kind==='report')download(reportHtml(),'EVTC_학습보고서.html','text/html;charset=utf-8');else download(JSON.stringify({version:VERSION,source:'교육용 이력',state:model.snapshot(),totals:model.totals()},null,2),'EVTC_학습이력.json','application/json');model.say('브라우저에 파일 저장을 요청했습니다. 저장한 파일을 확인하세요.');updateLive();}
function sources(){modal('자료·구현 범위·미확정 사항',`<div class="card"><h3>이번 수정의 기준</h3><p>방의 상대 배치는 이번에 제공한 선별실 그림. 공정과 판단 문제는 planet_evtc_first_batch.html을 기준으로 하되, 사용자 확인에 따라 타 선별기에서 수행하는 불량 재선별 단계와 별도의 불량별 검사 등급 설정 단계를 제외하여 EV ${STEP_COUNT}단계로 구성했습니다. 속도 설정 후 바로 챌린지로 이동하며, 이는 교육 흐름의 변경이지 실제 장비의 설정 생략을 허용하는 규정 변경은 아닙니다. 장비 외형과 부품 관계는 현장 사진 IMG_7253~7258 및 제조사 제2·3장. 검사·속도·알람·세척은 제1·4·5·6장과 SOP를 참고했습니다.</p></div><div class="card"><h3>SOP 상태</h3><p>SOP-EQM-00299 v1.1, 업로드본 페이지의 상태는 Draft이고 「본 문서는 유효하지 않음」 표시가 있습니다. 이를 현행 승인 SOP로 표현하지 않습니다. 별도 제8장 파일은 본문 추출이 되지 않았으므로 계정 역할은 SOP 1~2쪽의 표와 기존 2D 교육 틀만 참고합니다.</p></div><table><tr><th>항목</th><th>근거 / 구현</th></tr><tr><td>선별실 배치</td><td>좌우 양쪽 각각 두 짝 출입문, 파렛트와 기존 4드럼, 장비 왼쪽 3종 배출, 오른쪽 호퍼, 위쪽 보관함/작업대, 우측 선별용기·거치대·리프터. 방 치수는 미제공 → 상대 배치 근사.</td></tr><tr><td>3D</td><td>기존 코팅의 WebGL 렌더러·카메라·작업자·드럼 자산 재사용. 새 선별기 모델과 이송 경로를 같은 좌표에서 계산.</td></tr><tr><td>v0.4 부분 수정</td><td>속도 입력·적용·정지/재개·관찰/기록 구분. 리프터 결착 → 상승 → 고정축 수평 회전 → 하강·호퍼 안착. 회전축·각도·높이는 사용자 설명을 표현하기 위한 근사.</td></tr><tr><td>v0.3 현장 정정</td><td>드럼 전량 → 선별용기 → 리프터/판형 배출구 → 호퍼. 양품은 원래 빈 드럼으로 직접 수거하며 불량·미검사 포함 3종 배출. 선별용기 크기는 IBC 약 60%라는 설명의 시각 근사이며 바퀴는 생략. 리프터 기구·이동 궤적·드럼 전환은 교육용 축약입니다.</td></tr><tr><td>정제 경로</td><td>매뉴얼 제3장: 공급 → 원심력 피더 → T1 → T2 → 검사/배출. 외측 60:45는 매뉴얼 제5장 5.2.2. 숨은 배출 배관과 세부 형상은 근사.</td></tr><tr><td>v0.6 부분 수정 · 챌린지 진입</td><td>사용자 요청에 따라 독립 등급 설정·저장·판단 단계를 삭제. 속도 설정 → 챌린지로 직행합니다. 기존 교육용 검사조건을 사용하며 20T × 3회 시험·회수·기록은 유지합니다. 부적합 시 조건 재확인과 재시험은 챌린지 안에서만 가능합니다. 이전 결과를 적합으로 덮어쓰지 않습니다.</td></tr><tr><td>재선별 범위 · v0.5 부분 수정</td><td>미선별 1회 재선별은 유지합니다. 업로드 SOP 5.1.14의 불량 재선별은 사용자 설명상 다른 선별기에서 수행하므로 이 EV 시나리오의 단계·문제·재투입 동작에서 제외했습니다. 본검사 불량품은 별도 보관 수량으로 남기며 타 장비 결과를 생성하지 않습니다.</td></tr><tr><td>기록/수율</td><td>기존 2D는 단계 전환 시 미검 2820→99 등 고정값 전환이 있었음. 이번에는 누적을 되돌리지 않음. 98.5~100%와 QC/ERP 항목은 기존 2D 값이며 해당 품목 원문 기준은 이번 자료로 미확인.</td></tr><tr><td>클리닝</td><td>SOP 21~23쪽. 코팅정에 나정 침적을 자동 적용하지 않음. 조명·터치스크린 침적 금지.</td></tr></table><div class="photos"><div><img src="${ASSETS.plan}" alt="사용자가 제공한 선별실 배치도"><p>사용자 제공 상대 배치도</p></div><div><img src="${ASSETS.inside}" alt="실제 장비 내부 사진"><p>사용자 제공 내부 사진 · 반사로 보이는 형상을 독립 공정 라인으로 추가하지 않음</p></div></div><p class="tip warn">CAD 정밀 복원·검출 알고리즘·실설비 인터록 검증·GMP 전자서명은 이 시뮬레이터의 범위가 아닙니다. 가동 시간·이송 속도 시각화·부품 교체 동작은 교육용으로 축약했습니다. 실제 작업은 승인된 현행 문서와 담당자 교육이 필요합니다.</p>`,'sources');}

function validateCheckpoint(d){
 const old=d?.version==='EVTC-3D-0.2',previous=d?.version==='EVTC-3D-0.3',v04=d?.version==='EVTC-3D-0.4',v05=d?.version==='EVTC-3D-0.5',legacy=old||previous||v04,older=legacy||v05;
 if((d?.version!==VERSION&&!older)||d.type!=='checkpoint'||!d.state||d.state.version!==d.version)throw Error('다른 버전 또는 중단점 형식이 아닙니다.');
 const s=structuredClone(d.state),oldStep=s.step,oldGradeSaved=!!s.flags?.['save-grade'];
 if(!Number.isInteger(s.step)||s.step<0||s.step>(legacy?19:LAST_STEP)||!Array.isArray(s.records)||!Array.isArray(s.events)||s.job)throw Error('중단점 상태가 올바르지 않습니다.');
 if(!s.batch||!['all','good','bad','un','target'].every(k=>Number.isFinite(s.batch[k])&&s.batch[k]>=0)||s.batch.all>s.batch.target||s.batch.all!==s.batch.good+s.batch.bad+s.batch.un+(s.batch.unreject||0))throw Error('수량 대조가 맞지 않는 중단점입니다.');
 if((s.batch.unreject||0)!==0)throw Error('이전 4종 배출 수량이 있어 3종 배출로 자동 변환하지 않습니다.');
 if(!s.numeric||!s.sp||!s.pv||!s.flags||!s.quiz||![s.numeric.gate,s.numeric.center,s.numeric.gap,...Object.values(s.sp),...Object.values(s.pv)].every(Number.isFinite))throw Error('필수 상태가 없습니다.');
 if(!s.grade||!['surface','edge','depth'].every(k=>Number.isFinite(s.grade[k])&&s.grade[k]>=1&&s.grade[k]<=5)||!Number.isInteger(s.gradeRevision)||s.gradeRevision<0||!Array.isArray(s.challengeResults)||typeof s.challengeRecovered!=='boolean')throw Error('챌린지 조건/결과가 올바르지 않습니다.');
 for(const r of s.challengeResults)if(!Number.isInteger(r.revision)||r.revision<0||!Number.isInteger(r.round)||r.round<1||r.input!==20||!Number.isInteger(r.rejected)||r.rejected<0||r.rejected>20||r.missed!==20-r.rejected||r.pass!==(r.rejected===20)||typeof r.recovered!=='boolean')throw Error('챌린지 시험 수량/판정이 올바르지 않습니다.');
 for(const [label,result,input] of [['미선별 재선별',s.unPass,s.batch.un],['이전 불량 재선별',s.badPass,s.batch.bad]])if(result&&(!['all','good','bad','un'].every(k=>Number.isInteger(result[k])&&result[k]>=0)||result.all!==input||result.all!==result.good+result.bad+result.un))throw Error(label+' 수량 대조가 맞지 않습니다.');
 if(!legacy&&(s.badPass||s.flags['bad-authorize']||s.flags['bad-rerun']||s.mode==='reselect-bad'))throw Error('현 버전은 EV 불량 재선별 수행 상태를 지원하지 않습니다.');
 if(old){s.entryOpen=[false,false];const underway=s.step>10||!!s.flags['batch-start'];s.supplyAtLift=!!s.materialLoaded;s.supplyDocked=underway&&s.step<18;s.slideOpen=underway&&s.batch.all<s.batch.target;s.goodDrumsDocked=underway;if(s.materialLoaded)s.flags['prepare-vessel']=true;if(underway)for(const k of ['dock-good-drums','lift-vessel','open-slide'])s.flags[k]=true;s.events.push({n:s.events.length+1,kind:'checkpoint-layout-migration',at:s.clock,step:s.step,data:{from:d.version,to:VERSION,note:'기존 이력 보존. 새 용기/리프터 표시는 기존 투입·검사 상태에 대응하며 새로운 실제 작업 기록이 아님.'}});}
 s.speedRevision=Number.isInteger(s.speedRevision)?s.speedRevision:0;s.correctionRevision??=-1;s.stableRevision??=-1;s.stabilityDwell=0;s.stabilityEvidence??=null;
 if((old||previous)&&s.step===13){for(const k of ['correct-speed','stability','stable-window','correction-record'])delete s.flags[k];s.correctionRevision=-1;s.stableRevision=-1;s.stabilityEvidence=null;}
 if(legacy){
  const hadResult=!!s.badPass;
  if(hadResult||s.flags['bad-authorize']||s.quiz[16])s.legacyReinspection={fromVersion:d.version,sourceStep:16,result:structuredClone(s.badPass||null),flags:{authorized:!!s.flags['bad-authorize'],ran:!!s.flags['bad-rerun']},quiz:s.quiz[16]||false,throughRecordId:s.records.at(-1)?.id||0,note:'이전 버전 불량 재선별 참고 이력. 현 EV 수량 합계·완료 조건에서 제외. 기존 records/events는 원래 버전의 step 번호 그대로 보존.'};
  const quiz={};for(const [key,value]of Object.entries(s.quiz)){const i=Number(key);if(i!==16)quiz[i>16?i-1:i]=value;}s.quiz=quiz;
  s.step=oldStep>16?oldStep-1:oldStep;
  delete s.flags['bad-authorize'];delete s.flags['bad-rerun'];delete s.badPass;
  if(s.mode==='reselect-bad'){s.mode='standby';s.motors=false;}
