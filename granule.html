<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Singlepot 600 · 벽 부착형 정립 시뮬레이터</title>
<style>
:root{--bg:#e6ebe8;--surface:#fbfcfb;--ink:#15302d;--sub:#586a66;--line:#cfd9d3;--accent:#1f5a4f;--on:#fff;--soft:#dcebe3;--warn:#a8322b;--warnsoft:#fbe7e2;--steel:#9eabb0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f181c;--surface:#17252b;--ink:#e2eee9;--sub:#a3b6b0;--line:#2e434a;--accent:#8fd2b5;--on:#0f2922;--soft:#1f3a35;--warn:#ff9f95;--warnsoft:#3b2427;--steel:#688086}}
:root[data-theme="dark"]{--bg:#0f181c;--surface:#17252b;--ink:#e2eee9;--sub:#a3b6b0;--line:#2e434a;--accent:#8fd2b5;--on:#0f2922;--soft:#1f3a35;--warn:#ff9f95;--warnsoft:#3b2427;--steel:#688086}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 'Pretendard','Noto Sans KR','Malgun Gothic',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.5}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;height:100vh;min-height:760px;max-width:1560px;margin:0 auto;padding:10px;gap:8px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.top h1{font-size:18px;margin:0;letter-spacing:-.4px}
.top .meta{color:var(--sub);font-size:12px}
.top .grow{flex:1}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.bar{width:140px;height:7px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 13px;font-weight:650}
.btn:not(:disabled):hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.main{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(380px,1fr);gap:8px;min-height:0}
.scene{position:relative;background:#dde5e1;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:0}
.scene svg{display:block;width:100%;height:100%}
.tag{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.85);color:#34504b;border-radius:6px;padding:3px 8px;font-size:11px}
/* HMI */
.hmi{background:#0a1a45;border:4px solid #b9c0b4;border-radius:10px;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;overflow:hidden;font-family:Arial,'Malgun Gothic',sans-serif;color:#eef}
.hmi-top{background:#c4c8b6;color:#132430;display:flex;justify-content:space-between;gap:8px;padding:5px 9px;font-size:11px;font-weight:700}
.hmi-grid{display:grid;grid-template-columns:.95fr 1.05fr;gap:6px;padding:6px;min-height:0}
.recipe{background:#dcdfd6;color:#1b1b1b;border:2px solid #f0f2e8;display:flex;flex-direction:column;min-height:0}
.recipe h3{margin:0;padding:4px 7px 2px;font:700 17px Arial,sans-serif;letter-spacing:-.5px}
.recipe ol{list-style:none;margin:0;padding:2px 3px 4px;overflow:auto;font-size:10.5px;line-height:1.5}
.recipe li{display:grid;grid-template-columns:20px 1fr 1.05fr;gap:3px;padding:0 4px;cursor:pointer;white-space:nowrap}
.recipe li.past{color:#5d6b5f}
.recipe li.on{background:#1b2a7a;color:#fff}
.recipe li:hover:not(.on){background:#c6cabe}
.proc{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:6px;min-height:0}
.stepbox{background:#269494;color:#052e30;padding:5px 8px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-weight:700}
.stepbox .no{background:#dcdfd6;padding:1px 6px;font-size:12px}
.stepbox .nm{font-size:12px;line-height:1.25}
.status{font-size:10px;padding:3px 6px;background:#dcdfd6;color:#233}
.status.run{background:#3fd14a;color:#062}
.status.hold{background:#e04a3f;color:#fff;animation:blink .6s steps(2) infinite}
.status.done{background:#f2d46b;color:#332}
@keyframes blink{50%{opacity:.4}}
.mimic{background:linear-gradient(90deg,#2f4448,#51686d,#2f4448);border:1px solid #698699;display:grid;grid-template-columns:120px 1fr;align-items:center;gap:6px;padding:4px 6px}
.mimic svg{width:120px;height:86px}
.mimic .ml{font-size:10px;color:#d9e4e2;line-height:1.5}
.mimic .ml b{color:#9ff28f}
.vals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;align-content:start;overflow:auto}
.val{background:#d4d7c4;color:#162b37;border:1px solid #eef1dc;padding:3px 5px;font-size:9.5px;line-height:1.2;min-width:0}
.val b{display:block;color:#1f6a1c;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val.hot{border-color:#50d742}
.fkeys{display:flex;gap:4px;padding:5px 6px;background:#1b3aa0}
.fkey{flex:1;background:#d7d9d0;color:#222;text-align:center;font-size:10px;padding:4px 0;border:1px solid #fff}
.fkey.lit{background:#f3d56b}
.hmsg{background:#dcdfd6;color:#333;font-size:11px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* task */
.task{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.55fr) minmax(230px,.8fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-height:164px}
.code{font-size:12px;color:var(--sub);font-weight:700}
.task h2{font-size:18px;margin:2px 0 5px;letter-spacing:-.4px}
.task p{margin:0 0 6px;color:var(--sub);font-size:12.5px;max-width:62ch}
.src{font-size:11px;color:var(--sub)}
.work{min-width:0;max-height:176px;overflow:auto;padding-right:2px}
.chk{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;margin:0 6px 6px 0;font-size:12px;text-align:left}
.chk .box{width:16px;height:16px;border:1px solid var(--sub);border-radius:4px;display:grid;place-items:center;font-size:11px;flex:none}
.chk[aria-pressed="true"]{background:var(--soft);border-color:var(--accent)}
.chk[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--on)}
.q{font-weight:700;margin:4px 0 5px;font-size:13px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;margin-bottom:5px;font-size:12.5px}
.opt.good{background:var(--soft);border-color:var(--accent);font-weight:700}
.opt:not(:disabled):hover{border-color:var(--accent)}
.muted{color:var(--sub);font-size:12px}
.act{display:flex;flex-direction:column;gap:8px}
.fb{background:var(--soft);border-radius:10px;padding:9px 11px;font-size:12.5px;flex:1;min-height:60px}
.fb.bad{background:var(--warnsoft);color:var(--warn)}
.row{display:flex;gap:6px}
.row .btn{flex:1}
/* rail */
.rail{display:flex;gap:10px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 10px}
.grp{display:flex;flex-direction:column;gap:3px}
.grp small{color:var(--sub);font-size:10.5px;padding-left:2px}
.chips{display:flex;gap:4px}
.chip{min-width:58px;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:4px 5px;font-size:9.5px;line-height:1.2;text-align:center}
.chip b{display:block;font-size:12px}
.chip.done{background:var(--soft);border-color:var(--accent)}
.chip.done b::after{content:" ✓"}
.chip.cur{background:var(--accent);color:var(--on);border-color:var(--accent)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,15,15,.5);display:grid;place-items:center;z-index:20;padding:12px}
.modal[hidden]{display:none}
.card{background:var(--surface);color:var(--ink);width:min(580px,100%);max-height:88vh;overflow:auto;border-radius:14px;padding:18px 20px;border:1px solid var(--line)}
.card h3{margin:0 0 8px;font-size:19px}
.card p,.card li{color:var(--sub);font-size:13px}
.logrow{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:5px 0;font-size:12px}
/* scene fx */
#impeller,#chopper,#millRotor,.leg,.arm,#mImp{transform-box:fill-box;transform-origin:center}
@keyframes spin3d{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
@keyframes rot{to{transform:rotate(360deg)}}
.mix-slow #impeller{animation:spin3d 1.1s linear infinite}
.mix-fast #impeller{animation:spin3d .3s linear infinite}
.chop #chopper{animation:rot .16s linear infinite}
.flow{opacity:0;stroke-dasharray:6 14}
.loading .flow-hose,.spray .flow-liq{opacity:1;animation:dash .6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-40}}
.fx-spray{opacity:0}.spray .fx-spray{opacity:1}
.fx-spray line{animation:drip .55s linear infinite}
.fx-spray line:nth-child(2){animation-delay:.18s}.fx-spray line:nth-child(3){animation-delay:.36s}
@keyframes drip{from{transform:translateY(-6px);opacity:0}30%{opacity:1}to{transform:translateY(26px);opacity:0}}
.vapor path{opacity:0}
.drying .vapor path{animation:rise 2.2s ease-in infinite}
.vapor path:nth-child(2){animation-delay:.7s}.vapor path:nth-child(3){animation-delay:1.4s}
@keyframes rise{0%{opacity:0;transform:translateY(10px)}30%{opacity:.85}100%{opacity:0;transform:translateY(-34px)}}
#mwGlow{opacity:0}.mw #mwGlow{animation:pulse .9s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.1}to{opacity:.6}}
.mw .mw-ind{fill:#ff8a3d}
.fx-mill{opacity:0}.milling .fx-mill{opacity:1}
.fx-mill circle{animation:fall .5s linear infinite}
.fx-mill circle:nth-child(2n){animation-delay:.25s}
@keyframes fall{from{transform:translateY(-4px)}to{transform:translateY(30px)}}
.milling #millRotor{animation:rot .22s linear infinite}
.sampling #sampleCup{fill:#f2d46b}
.panel-active #panelScreen{fill:#1d49b0}
.run-state #lampG{fill:#48e062}
.alarm #lampR{fill:#ff3b30;animation:blink .5s steps(2) infinite}
#op{transition:transform 1.3s ease-in-out}
#bubble{transition:transform 1.3s ease-in-out}
#opFlip{transition:transform .3s}
.leg,.arm{transform-origin:50% 5%}
#op.walking .leg-f,#op.walking .arm-b{animation:swA .42s ease-in-out infinite alternate}
#op.walking .leg-b,#op.walking .arm-f{animation:swB .42s ease-in-out infinite alternate}
@keyframes swA{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
@keyframes swB{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
#op.working .arm-f{animation:press .45s ease-in-out infinite alternate}
@keyframes press{from{transform:rotate(-105deg)}to{transform:rotate(-70deg)}}
#opBody{animation:breathe 2.4s ease-in-out infinite}
#op.walking #opBody{animation:bob .21s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
@keyframes breathe{50%{transform:translateY(-1px)}}
.m-mix #mImp{animation:spin3d .5s linear infinite}
#mDrop,#mWave,#mArrow{opacity:0}
.m-drop #mDrop,.m-wave #mWave,.m-disc #mArrow{opacity:1}
.lbl{font-size:11px;fill:#3f524e;font-weight:700}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:1100px){.app{height:auto;min-height:0}.main{grid-template-columns:1fr}.scene{aspect-ratio:8/5}.hmi{min-height:520px}.task{grid-template-columns:1fr}.work{max-height:none}}
</style>
</head>

<div class="app">
  <header class="top">
    <div><h1>Singlepot 600 첫 배치 시뮬레이터</h1><div class="meta">교육용 가상 배치 TRAIN-600-001 · Recipe DEMO-600 / DEMO-v1 · 실설비 연동 없음</div></div>
    <div class="grow"></div>
    <div class="prog"><span id="progText">0 / 26 완료</span><div class="bar"><i id="progBar"></i></div></div>

    <button class="btn" id="infoBtn" type="button">자료·주의</button>
  </header>

  <div class="main">
    <div class="scene">
      <span class="tag">벽 부착형 Singlepot · 스윙 Mill · IBC 직접 수거</span>

        <!-- liquid tank + pump -->

          <line x1="196" y1="262" x2="196" y2="288" stroke="#8d989c" stroke-width="3"/><line x1="234" y1="262" x2="234" y2="288" stroke="#8d989c" stroke-width="3"/>

        <!-- control panel -->

        <ellipse cx="400" cy="100" rx="26" ry="6" fill="#e9eeef" stroke="#7a878b"/>

        <rect x="318" y="166" width="32" height="22" rx="3" fill="#dfe4e6" stroke="#8e9a9e"/><rect class="mw-ind" x="327" y="172" width="14" height="10" fill="#7b8a90"/>

const LAST=STEPS.length-1;

const st=STEPS.map(()=>({checks:new Set(),choice:false,ran:false}));
const doneSet=new Set();const log=[];
let cur=0,running=false,errors=0,hold=false,fbMsg='',fbBad=false,moveToken=0,opPos={x:400,y:478,d:1};

const taskOk=i=>{const s=STEPS[i],x=st[i];return (s.checks||[]).every((_,k)=>x.checks.has(k))&&(!s.q||x.choice)};
const isDone=i=>taskOk(i)&&(!STEPS[i].run||st[i].ran);

/* ---------- operator ---------- */
const scaleAt=y=>.55+(y-250)/250*.55;
function setOpT(){const s=scaleAt(opPos.y);$('#op').style.transform=`translate(${opPos.x}px,${opPos.y}px) scale(${s})`;$('#bubble').style.transform=`translate(${opPos.x}px,${opPos.y-118*s}px)`;}
const flip=d=>$('#opFlip').style.transform=`scaleX(${d})`;
function bubble(t){$('#bubbleText').textContent=t;const w=Math.min(280,t.length*12.5+26);const r=$('#bubbleRect');r.setAttribute('x',-w/2);r.setAttribute('width',w);}
function moveTo(key,cb){const L=LOC[key],tok=++moveToken,op=$('#op');const dist=Math.hypot(L.x-opPos.x,L.y-opPos.y);const dur=Math.max(350,Math.min(1600,dist*4));
 op.style.transitionDuration=dur+'ms';$('#bubble').style.transitionDuration=dur+'ms';
 if(dist>4){flip(L.x<opPos.x?-1:1);op.classList.add('walking');}
 opPos={...L};setOpT();
 setTimeout(()=>{if(tok!==moveToken&&!cb)return;op.classList.remove('walking');flip(L.d);cb&&cb();},dist>4?dur:60);}
function walkPath(arr,cb){let k=0;const nx=()=>k<arr.length?moveTo(arr[k++],()=>setTimeout(nx,120)):cb();nx();}
const working=on=>$('#op').classList.toggle('working',on);

/* ---------- scene ---------- */
function sceneAt(i){const sc={level:0,tone:'powder',ibc:1,received:0,dock:0,disc:0};for(let j=0;j<i;j++)Object.assign(sc,STEPS[j].set||{});if(st[i].ran||isDone(i))Object.assign(sc,STEPS[i].set||{});return sc;}
const TONE={powder:'#f1eee6',damp:'#e6dcc4',wet:'#d5c59f',granule:'url(#pGran)',dry:'url(#pDry)'};
function applyScene(sc){const h=sc.level*44;const p=$('#powder');p.setAttribute('y',298-h);p.setAttribute('height',h);p.setAttribute('fill',TONE[sc.tone]);
 const ih=78*(sc.dock>.01?sc.received:sc.ibc);const f=$('#ibcFill');f.setAttribute('y',298-ih);f.setAttribute('height',ih);f.setAttribute('fill',sc.dock>.01?'url(#pDry)':'#efe8d6');
 const move=Math.min(1,sc.dock/.55), swing=Math.max(0,(sc.dock-.55)/.45), ease=x=>x*x*(3-2*x);
 const x=251+(118-251)*ease(move),y=194+(228-194)*ease(move),ang=100*(1-ease(swing));
 $('#ibcUnit').setAttribute('transform',`translate(${x} ${y}) scale(.6)`);
 $('#millSwing').setAttribute('transform',`rotate(${ang} 640 366)`);
 $('#millHead').setAttribute('transform',`rotate(${-ang} 534 366)`);
 $('#millCoupling').setAttribute('opacity',swing>.98?1:0);
 $('#feedHose').setAttribute('opacity',sc.dock>.001?0:1);
 $('#receiveLabel').setAttribute('opacity',move>.98?1:0);
 $('#millLabel').textContent=swing>.98?'Mill · 배출구 결합':swing>0?'Mill · 스윙 중':'벽 부착 Mill · 대기';
 if(running&&STEPS[cur].rno===17){
  const px=590+(445-590)*ease(move),py=466+(478-466)*ease(move);
  opPos={x:move<1?px:580,y:move<1?py:431,d:move<1?-1:-1};setOpT();
  $('#op').classList.toggle('walking',move<1);bubble(move<1?'IBC를 수거 위치로 이동':'Mill을 배출구에 결합');
 }
 $('#discLine').setAttribute('transform',`rotate(${sc.disc*.9} 478 320)`);}
function lerp(a,b,p){const o={};for(const k in b){o[k]=(typeof a[k]==='number'&&typeof b[k]==='number')?a[k]+(b[k]-a[k])*p:(k==='tone'?(p>.5?b[k]:a[k]):b[k]);}return o;}

/* ---------- HMI ---------- */
const TILES=[['mixer','Mixer'],['chopper','Chopper'],['power','Mixer power'],['temp','TE01090'],['press','PET01090 Bowl'],['pump','Liquid pump'],['liquid','Liquid fed'],['mw','MW power'],['energy','MW energy'],['disc','Discharge'],['mill','Mill speed'],['timer','Step timer']];
$('#vals').innerHTML=TILES.map(([k,l])=>`<div class="val" id="t-${k}">${l}<b id="v-${k}">—</b></div>`).join('');
$('#recipeList').innerHTML=RECIPE.map((r,n)=>`<li data-r="${n}"><span>${n}</span><span>${r[0]}</span><span>${r[1]}</span></li>`).join('');
function fmt(k,v){if(v==null)return k==='press'?'Recipe 값':k==='mill'?'승인 조건':'—';
 switch(k){case 'mixer':case 'chopper':return Math.round(v)+' rpm';case 'power':case 'mw':return v.toFixed(1)+' kW';case 'temp':return v.toFixed(1)+' ℃';case 'press':return Math.round(v)+' mbar';
 case 'pump':case 'disc':case 'mill':return Math.round(v)+' %';case 'liquid':return v.toFixed(2)+' kg';case 'energy':return Math.round(v).toLocaleString('en-US')+' kJ';
 case 'timer':{const t=Math.max(0,Math.round(v));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}}}
function hmiRest(i){const s=STEPS[i];if(st[i].ran||isDone(i))return s.hmi;const p=i>0?STEPS[i-1].hmi:IDLE;
 return Object.assign({},p,{mixer:p.mixer==null?null:0,chopper:p.chopper==null?null:0,power:0,pump:0,mw:0,mill:0,disc:s.rno>=19?(STEPS[i-1].hmi.disc||0):0,timer:s.hmi.timer,status:s.group==='prep'&&i<2?'LOGIN':'READY'});}
function renderHMI(v,i){const s=STEPS[i];
 TILES.forEach(([k])=>{$('#v-'+k).textContent=fmt(k,v[k]);$('#t-'+k).classList.toggle('hot',typeof v[k]==='number'&&v[k]>0&&!['temp','press','liquid','energy','timer'].includes(k));});
 $('#hNo').textContent=s.rno!=null?s.rno:s.code;$('#hName').textContent=s.rno!=null?(s.name+(s.sub?' · '+s.sub:'')):s.title;
 const status=hold?'HOLD':v.status;const el=$('#hStatus');el.textContent=status;el.className='status'+(status==='RUNNING'?' run':status==='HOLD'?' hold':['COMPLETE','END','LOADED','CHECKED'].includes(status)?' done':'');
 $$('#recipeList li').forEach(li=>{const n=+li.dataset.r;const ref=s.rno!=null?s.rno:(s.group==='end'?99:-1);li.classList.toggle('on',n===s.rno);li.classList.toggle('past',n<ref);});
 const m=$('#mimic');m.classList.toggle('m-mix',v.mixer>0);m.classList.toggle('m-drop',v.pump>0);m.classList.toggle('m-wave',v.mw>0);m.classList.toggle('m-disc',v.disc>0);
 $('#mLine').innerHTML=`Mixer <b>${fmt('mixer',v.mixer)}</b><br>Chopper <b>${fmt('chopper',v.chopper)}</b><br>Bowl <b>${fmt('press',v.press)}</b><br>교육용 가상값`;
 $('#hMsg').textContent=hold?'ALARM · 가상 위험 상황 · 공정 HOLD':`Description: ${s.title}`;
 $('#fF2').classList.toggle('lit',!!s.run&&!st[i].ran&&(s.runFirst||taskOk(i))&&!running);}
function $$(q){return Array.from(document.querySelectorAll(q));}

/* ---------- task & rail ---------- */
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderRail(){const groups=[['준비','prep'],['Recipe 0–21','recipe'],['마감','end']];
 $('#rail').innerHTML=groups.map(([lab,g])=>`<div class="grp"><small>${lab}</small><div class="chips">${STEPS.map((s,i)=>s.group!==g?'':`<button type="button" class="chip ${doneSet.has(i)?'done':''} ${i===cur?'cur':''}" data-go="${i}" ${running?'disabled':''} aria-current="${i===cur?'step':'false'}"><b>${esc(s.code)}</b>${esc(s.rno!=null?s.name:s.name)}${s.sub&&s.rno!=null?'<br>'+esc(s.sub.length>11?s.sub.slice(0,10)+'…':s.sub):''}</button>`).join('')}</div></div>`).join('');
 const c=document.querySelector('.chip.cur');c&&c.scrollIntoView({inline:'center',block:'nearest'});}
function renderTask(){const s=STEPS[cur],x=st[cur],done=isDone(cur);const lock=running||done||(s.runFirst&&!x.ran);
 $('#tCode').textContent=(s.rno!=null?`Recipe ${s.rno} · ${s.name}${s.sub?' '+s.sub:''}`:`${s.code} · ${s.name}${s.sub?' '+s.sub:''}`);
 $('#tTitle').textContent=s.title;$('#tInstr').textContent=s.instr;$('#tSrc').textContent='근거: '+s.src;
 let h='';
 if(s.runFirst&&!x.ran)h+=`<p class="muted">먼저 오른쪽 “${esc(s.run.label)}”을 눌러 진행하세요.</p>`;
 if(s.checks)h+=s.checks.map((c,k)=>`<button type="button" class="chk" data-chk="${k}" aria-pressed="${x.checks.has(k)}" ${lock?'disabled':''}><span class="box">${x.checks.has(k)?'✓':''}</span>${esc(c)}</button>`).join('');
 if(s.q)h+=`<div class="q">${esc(s.q)}</div>`+s.opts.map((o,k)=>`<button type="button" class="opt ${x.choice&&o[1]?'good':''}" data-opt="${k}" ${lock?'disabled':''}>${esc(o[0])}</button>`).join('');
 if(!s.checks&&!s.q)h+='<p class="muted">확인할 항목이 없어요. 오른쪽 실행 버튼으로 단계를 진행하세요.</p>';
 $('#tWork').innerHTML=h;
 const rb=$('#runBtn');if(s.run){rb.hidden=false;rb.textContent=x.ran?'실행 완료 ✓':s.run.label;rb.disabled=running||x.ran||!(s.runFirst||taskOk(cur));}else rb.hidden=true;
 $('#prevBtn').disabled=running||cur===0;
 const nb=$('#nextBtn');nb.disabled=running||!done;nb.textContent=cur===LAST?'결과 보기':'다음 단계';nb.classList.toggle('primary',done);
 const fb=$('#fb');fb.textContent=fbMsg||(done?'완료했어요. 다음 단계로 이동하세요.':s.runFirst&&!x.ran?'실행 후 결과를 판단해요.':'확인 항목과 질문을 마친 뒤 실행해요.');fb.classList.toggle('bad',fbBad);
 $('#progText').textContent=doneSet.size+' / '+STEPS.length+' 완료';$('#progBar').style.width=(doneSet.size/STEPS.length*100)+'%';}
function render(){renderTask();renderRail();if(!running){applyScene(sceneAt(cur));renderHMI(hmiRest(cur),cur);}}
function say(t,bad){fbMsg=t;fbBad=!!bad;}
function afterChange(){if(isDone(cur)&&!doneSet.has(cur)){doneSet.add(cur);log.push([STEPS[cur].code,STEPS[cur].title]);if(!fbBad)fbMsg=fbMsg||'완료!';if(cur===LAST){render();setTimeout(summary,700);return;}}render();}
function setStep(i){if(running||i<0||i>LAST)return;cur=i;fbMsg='';fbBad=false;working(false);render();const s=STEPS[i];moveTo(s.loc);bubble(s.say||s.title);}

function runStep(){const i=cur,s=STEPS[i];if(running||!s.run||st[i].ran)return;if(!s.runFirst&&!taskOk(i)){say('먼저 확인 항목과 질문을 완료해 주세요.',true);render();return;}
 const from=sceneAt(i),hFrom=hmiRest(i);running=true;say(s.run.say?`${s.run.label}…`:'진행 중…');render();
 walkPath(s.run.path||[s.loc],()=>{working(true);bubble(s.run.say||s.title);const anim=s.run.anim||[];anim.forEach(c=>scene.classList.add(c));
  const to=Object.assign({},from,s.set||{}),hTo=s.hmi,dur=s.run.dur||2500,t0=performance.now();
  const frame=now=>{const p=Math.min(1,(now-t0)/dur);applyScene(lerp(from,to,p));
   const hv=lerp(hFrom,hTo,Math.min(1,p*1.6));hv.timer=hTo.timer!=null?hTo.timer*(1-p):null;hv.status='RUNNING';if(hTo.mixer===0&&hTo.chopper===0&&!anim.length)hv.status='RUNNING';renderHMI(hv,i);
   if(p<1)requestAnimationFrame(frame);else{anim.forEach(c=>scene.classList.remove(c));working(false);$('#op').classList.remove('walking');st[i].ran=true;running=false;
    say(s.q&&!st[i].choice?'실행을 마쳤어요. 이제 결과를 판단하세요.':s.checks&&!taskOk(i)?'실행을 마쳤어요. 남은 확인 항목을 체크하세요.':'완료했어요. 다음 단계로 이동하세요.');afterChange();}};
  requestAnimationFrame(frame);});}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.go!=null){setStep(+b.dataset.go);return;}
 if(b.dataset.chk!=null){const x=st[cur],k=+b.dataset.chk;x.checks.has(k)?x.checks.delete(k):x.checks.add(k);say('');afterChange();return;}
 if(b.dataset.opt!=null){const o=STEPS[cur].opts[+b.dataset.opt];if(o[1]){st[cur].choice=true;say(o[2]);bubble('좋아요!');}else{errors++;say(o[2],true);bubble('다시 볼까요?');}afterChange();return;}
 if(b.id==='runBtn')return runStep();
 if(b.id==='nextBtn'){cur===LAST?summary():setStep(cur+1);return;}
 if(b.id==='prevBtn')return setStep(cur-1);
 if(b.id==='drillBtn')return drill(0);
 if(b.id==='infoBtn')return info();
 if(b.dataset.drill!=null)return drillAnswer(+b.dataset.drill);
 if(b.dataset.close!=null){closeModal();return;}
 if(b.dataset.reset!=null){location.reload();return;}});
document.getElementById('recipeList').addEventListener('click',e=>{const li=e.target.closest('li');if(!li)return;const i=STEPS.findIndex(s=>s.rno===+li.dataset.r);setStep(i);});

/* ---------- modal: drill / info / summary ---------- */
const modal=$('#modal'),card=$('#modalCard');
function openModal(h){card.innerHTML=h;modal.hidden=false;const f=card.querySelector('button');f&&f.focus();}
function closeModal(){modal.hidden=true;if(hold){hold=false;scene.classList.remove('alarm');render();}}
const DRILL=[
 {q:'가동 중 이상 소음과 위험한 움직임을 발견했어요. 가장 먼저 할 일은?',opts:[['즉시 비상 정지',1],['Next로 다음 단계 진행',0],['Restart를 반복해서 누르기',0]],bad:'원인이 해결되지 않은 상태로 진행하거나 재시작하지 않아요. 먼저 비상 정지!'},
 {q:'공정이 정지했어요. 다음 행동은?',opts:[['팀장에게 보고하고 조치를 받기',1],['비상 정지만 풀고 바로 재시작',0]],bad:'혼자 판단해 재시작하지 않아요. 팀장에게 보고해요.'},
 {q:'팀장 보고 후, 재시작의 전제 조건은?',opts:[['문제 해결 확인 후 비상 정지 원상복귀, 현재 공정 재시작',1],['알람만 지우고 다음 단계로 넘기기',0]],bad:'알람만 지우는 것은 해결이 아니에요. 원인 해결을 확인해야 해요.'}];
let drillPhase=0;
function drill(p){if(running)return;drillPhase=p;hold=true;scene.classList.add('alarm');renderHMI(hmiRest(cur),cur);moveTo('panel');bubble('위험! 멈춰야 해요');
 const d=DRILL[p];openModal(`<h3>비상상황 훈련 ${p+1}/3</h3><p>제조 흐름과 별개인 가상 상황이에요.</p><div class="q">${d.q}</div>${d.opts.map((o,k)=>`<button type="button" class="opt" data-drill="${k}">${o[0]}</button>`).join('')}<p id="drillFb" class="muted"></p>`);}
function drillAnswer(k){const d=DRILL[drillPhase];if(!d.opts[k][1]){errors++;$('#drillFb').textContent=d.bad;$('#drillFb').style.color='var(--warn)';return;}
 if(drillPhase<2){if(drillPhase===0)working(true);drill(drillPhase+1);return;}
 working(false);log.push(['훈련','비상 정지 → 팀장 보고 → 해결 확인 후 복귀']);
 openModal('<h3>비상상황 대응 완료</h3><p>멈춤 → 보고 → 해결 확인 후 복귀 순서를 확인했어요. 알람별 상세 조치는 현행 SOP와 담당자 지시를 따릅니다.</p><button type="button" class="btn primary" data-close>훈련으로 돌아가기</button>');}
function info(){openModal(`<h3>자료와 주의사항</h3>
<p>SOP「과립기(One pot 300&amp;600) 가동방법」, 제조지시기록서 1~9항, Singlepot Recipe View 단계(0~21)를 바탕으로 만든 교육용 초안이에요. 실제 사진은 사용하지 않았습니다.</p>
<ul>
<li>습식 코밀(187S·사각 임펠러) 단계는 제외했어요. 흐름은 Recipe View 순서를 따릅니다.</li>
<li>설비 배치는 사용자 설명을 반영한 모식도입니다. Singlepot·Mill은 벽 부착형이며, 정립 시 IBC를 아래로 옮겨 직접 수거해요. 세부 Recipe 조건은 추가 자료를 받은 뒤 맞출 예정입니다.</li>
<li>HMI 수치 중 기록서에 없는 값(펌프 60%, 정제수 16/16 kg 분배, 온도, 80 mbar, 단계별 누적 에너지 등)은 교육용 가상값이에요.</li>
<li>DRYING 0/1/4 ~ 0/10/4의 숫자 의미, 진공 이송 압력, Mill speed는 Recipe·승인 조건에서 확인해야 해요.</li>
<li>Liquid feed tube 분리 시점은 현행 SOP 순서를 확인하세요.</li>
<li>Recipe 이름·버전·제조번호는 가상 값이며, 훈련 완료는 작업 자격이나 전자서명을 뜻하지 않아요.</li>
</ul><button type="button" class="btn primary" data-close>닫기</button>`);}
function summary(){openModal(`<h3>첫 배치 훈련 결과</h3><p>완료 ${doneSet.size} / ${STEPS.length} · 다시 선택한 횟수 ${errors}회</p>${log.map(l=>`<div class="logrow"><span>${esc(l[0])}</span><strong>${esc(l[1])}</strong></div>`).join('')}<p style="margin-top:10px">가상 결과이며 새로 열면 사라져요. 실제 작업 전에는 담당자의 교육과 자격 확인이 필요해요.</p><div class="row"><button type="button" class="btn" data-close>닫기</button><button type="button" class="btn primary" data-reset>처음부터 다시</button></div>`);}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeModal();});

setOpT();flip(1);
setTimeout(()=>setStep(0),250);
})();
</script>
</body>
