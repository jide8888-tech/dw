# 주식 공부 100일 챌린지 자동화 설정
# 복사해서 config.yaml 로 저장한 뒤 수정하세요.

# full      : 100일을 마친 상태 — 복습/예습/추적/모의매매 모두 매일 자동 수행
# challenge : 시작일(challenge_start) 기준 Day 단계에 맞춰 기능을 하나씩 켬
mode: full
challenge_start: 2026-11-02

data_dir: data            # DB, 종목 노트, 차트, 리포트 저장 위치
markets: [KOSPI, KOSDAQ]

filters:
  upper_limit_pct: 29.5   # 이 이상 오르면 상한가로 간주
  volume_min: 10000000    # 거래량 천만 주
  value_min_eok: 100      # 테마 분석 대상: 거래대금 100억 원 이상
  hot_pct_min: 10.0       #               AND 등락률 10% 이상

# 테마 분석 엑셀 (data/excel/날짜_테마분석.xlsx) — evening 실행 시 자동 생성
excel: true

# 테마 사전 추가/수정 (기본 사전: 반도체, AI, 2차전지, 로봇, 바이오, 원전, 방산, 조선, 전력·전선,
# 우주항공, 게임, 엔터·미디어, 화장품·소비재, 자동차, 건설·인프라, 정책·정치, 금융·증권,
# 에너지·화학, 초전도체·신소재, 의료기기). 같은 이름을 쓰면 기본 사전을 덮어씁니다.
themes:
  양자컴퓨터: [양자, 양자컴퓨터, 양자암호, 아이온큐]
  # 저PBR: [저PBR, 밸류업, 자사주 소각]

# Day 3: 내 이력과 연결되는 주력 분야 (분야명: 키워드 목록)
focus_sectors:
  게임: [게임, 넥슨, 엔씨, 크래프톤, 넷마블, 퍼블리싱, 신작]
  반도체: [반도체, HBM, 패키징, 장비, 웨이퍼, 파운드리]

sources:
  prices: auto            # auto | kiwoom | krx | naver | demo
                          #  auto: 오늘 = 키움(키 있으면) → KRX → 네이버, 과거 = KRX
  news: [google, naver]   # naver 는 API 키가 있을 때만 사용

# API 키 (환경변수가 있으면 환경변수가 우선)
#   DART_API_KEY, NAVER_CLIENT_ID, NAVER_CLIENT_SECRET, KRX_ID, KRX_PW,
#   KIWOOM_APPKEY, KIWOOM_SECRETKEY
keys:
  kiwoom_appkey: ""       # 키움 REST API (openapi.kiwoom.com) — 조회 전용, 주문 안 함
  kiwoom_secretkey: ""
  dart: ""
  naver_client_id: ""
  naver_client_secret: ""
  krx_id: ""
  krx_pw: ""

kiwoom:
  mock: false             # true: 모의투자 서버(mockapi.kiwoom.com) — 모의투자용 키일 때

watch:                    # 장중 5분 감시 (python -m stock100 watch, 키움 REST API 필요)
  interval_min: 5         # 5분마다 조회
  start: "09:00"
  end: "15:30"
  # 감시 대상: 최근 lookback_days 거래일 안에 거래대금 top_n 위 이내 + 등락률 min_pct% 이상이었던 종목
  lookback_days: 5        # 약 1주일
  top_n: 100
  min_pct: 20.0
  extra_codes: []         # 직접 추가할 종목코드 예: ["053610", "005930"]
  # 🔴 주목(빨간 음영): 5분 거래대금 증가 ≥ value_delta_eok 억 AND 5분 등락률 변화 ≥ pct_delta %p
  value_delta_eok: 5.0
  pct_delta: 1.5
  # 순위 상승: 거래대금 순위가 rank_up_min 계단 이상 위로 (예: 34위 → 30위)
  rank_basis: watchlist   # watchlist = 감시 종목 안에서의 순위 / market = 전체 시장 순위
  rank_up_min: 1
  # 매수 신호: both = 주목 + 순위 상승 동시 / rank_only = 순위 상승만
  buy_rule: both
  cash: 10000000          # 보유금 (원)
  buy_ratio: 0.2          # 매수 신호 때 남은 보유금의 20% 제안 (실제 주문 안 함)
  beep: true              # 매수 신호 때 알림음

morning:                  # Day 41~: 새벽 예습
  queries: [특징주, 상한가, 공급계약, 수주, 합작, 세계 최초, 인수, 정부 지원]
  min_score: 2            # 이 점수 이상인 종목만 시그널로 기록

track:                    # Day 51~: 추정 → 관찰 → 기록
  horizons: [1, 3, 5]     # 시그널 후 N 거래일 수익률 기록
  hit_pct: 3.0            # 기간 중 최고가가 기준가 대비 +3% 이상이면 적중

paper:                    # Day 71~: 소액 매매 (모의)
  enabled: true
  take_profit_pct: 3.0    # '더 가면 좋겠다' = 욕심 → 익절 라인
  stop_loss_pct: 3.0
  max_per_day: 1
