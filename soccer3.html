<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>세 골대 공놀이</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 태블릿 화면 전체가 경기장. 골대 세 개가 삼각형 꼭짓점(위 가운데, 아래 양 구석)에 있고 각자 자기 골대를 지킴 */
:root{
  --bg:#123B24; --board:rgba(8,30,18,.82); --ink:#FFFFFF; --muted:#BFE3C9;
  --c0:#FF8A1F; --c1:#2F7BF0; --c2:#FF4FA3; --gold:#FFD23F; --panel:rgba(8,30,18,.94);
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.fieldbox{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(6px,env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
canvas{display:block;border-radius:14px;touch-action:none}
.score{position:fixed;top:max(8px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));z-index:3;display:flex;flex-direction:column;gap:2px;
  font-family:var(--f-display);background:var(--board);border-radius:12px;padding:6px 12px;pointer-events:none;min-width:110px}
.score .clock{font-size:20px;color:var(--muted);font-variant-numeric:tabular-nums}
.score .row{display:flex;align-items:center;gap:6px;font-size:16px}
.score .row i{width:12px;height:12px;border-radius:50%;border:2px solid #fff;flex:none}
.score .row span{flex:1;max-width:7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .row b{font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.pausebtn{position:fixed;z-index:3;top:max(8px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));font-family:var(--f-display);font-size:17px;border:0;border-radius:12px;padding:8px 14px;background:rgba(0,0,0,.4);color:#fff;cursor:pointer}
.overlay{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(6,22,13,.8);overflow:auto;
  padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));-webkit-user-select:auto;user-select:auto}
.card{width:min(700px,100%);background:var(--panel);border:2px solid rgba(255,255,255,.12);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;margin:auto}
.card h1{font-family:var(--f-display);font-weight:400;font-size:clamp(38px,7.5vw,60px);line-height:1;margin:0}
.card h1 span{color:var(--gold)}
.lead{margin:0;color:var(--muted);font-size:15px}
.rows{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.06);border-radius:14px;padding:8px 10px;border-left:10px solid}
.prow input{flex:1 1 140px;min-width:0;font:inherit;font-family:var(--f-display);font-size:22px;background:rgba(255,255,255,.1);border:0;border-radius:10px;color:#fff;padding:6px 10px}
.prow .where{font-size:13px;color:var(--muted);flex-basis:100%;order:3;margin-top:-4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-family:var(--f-display);font-size:17px;color:#fff;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);border-radius:10px;padding:5px 11px;cursor:pointer}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#2a2000}
.opt{display:flex;flex-direction:column;gap:6px}
.opt .lb{font-size:14px;color:var(--muted)}
.go{font-family:var(--f-display);font-size:30px;border:0;border-radius:16px;padding:14px;background:var(--gold);color:#2a2000;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.go.sub{background:rgba(255,255,255,.12);color:#fff;font-size:20px;padding:10px}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.final{display:flex;flex-direction:column;gap:8px}
.final div{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-size:26px;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.06)}
.final div i{width:18px;height:18px;border-radius:50%;border:3px solid #fff}
.final div span{flex:1}
.final div b{font-weight:400;font-size:34px}
.msg{text-align:center;font-family:var(--f-display);font-size:clamp(24px,5vw,36px);margin:0}
</style>

<div class="fieldbox" id="fieldbox"><canvas id="cv"></canvas></div>
<div class="score" id="score"><div class="clock" id="clock">2:00</div></div>
<button class="pausebtn" id="pauseBtn" type="button" hidden>일시정지</button>

<div class="overlay" id="menu">
  <div class="card">
    <h1>세 골대 <span>공놀이</span></h1>
    <p class="lead">셋이 각자 자기 골대를 지켜요. 다른 사람 골대에 공을 넣으면 1점! 자기 선수를 손가락으로 꾹 누른 채 끌면 따라와요. 다른 곳을 눌러도 아무 일도 안 생겨서 여럿이 동시에 만져도 괜찮아요.</p>
    <div class="rows" id="rows"></div>
    <div class="opt"><span class="lb">경기 시간</span>
      <div class="seg" id="optTime"><button type="button" data-v="60">1분</button><button type="button" data-v="120">2분</button><button type="button" data-v="180">3분</button></div></div>
    <button class="go" id="startBtn" type="button">시작!</button>
    <p class="lead" style="font-size:13px">난이도: 쉬울수록 내 골대가 작아지고, 내 선수가 빨라지고, 공을 세게 차요. 태블릿은 가로로 두세요.</p>
  </div>
</div>

<div class="overlay" id="pause" hidden>
  <div class="card" style="width:min(380px,100%)">
    <p class="msg">잠깐 쉬는 중</p>
    <button class="go" id="resumeBtn" type="button">계속하기</button>
    <button class="go sub" id="quitBtn" type="button">처음 화면으로</button>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card" style="width:min(460px,100%)">
    <p class="msg" id="endMsg"></p>
    <div class="final" id="final"></div>
    <button class="go" id="againBtn" type="button">한 판 더!</button>
    <button class="go sub" id="menuBtn" type="button">처음 화면으로</button>
  </div>
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const FW=1000,FH=600,GD=48,BR=17,PR=38,C=195,C2=80,GOALW=210;
const VX=-20,VY=-64,VW=FW+40,VH=FH+84;
const COLS=["#FF8A1F","#2F7BF0","#FF4FA3"];
const CNAME=["주황","파랑","분홍"];
const WHERE=["위쪽 골대","왼쪽 아래 골대","오른쪽 아래 골대"];
const LEVELS=[{n:"어렵게",goal:1.2,spd:.85,kick:.9},{n:"보통",goal:1,spd:1,kick:1},{n:"쉽게",goal:.8,spd:1.1,kick:1.15},{n:"아주 쉽게",goal:.64,spd:1.2,kick:1.3}];
let opt={time:120};
let roster=[{name:"첫째",lv:0},{name:"둘째",lv:2},{name:"셋째",lv:2}];
try{const o=JSON.parse(localStorage.getItem("ball3")||"null");if(o){if(o.opt)opt={...opt,...o.opt};if(o.roster&&o.roster.length===3)roster=o.roster;}}catch(e){}
const save=()=>{try{localStorage.setItem("ball3",JSON.stringify({opt,roster}));}catch(e){}};

/* ---------- 경기장 모양 ---------- */
const S2=Math.SQRT1_2;
const GOALS=[
  {c:{x:FW/2,y:0},n:{x:0,y:1}},
  {c:{x:C/2,y:FH-C/2},n:{x:S2,y:-S2}},
  {c:{x:FW-C/2,y:FH-C/2},n:{x:-S2,y:-S2}}];
GOALS.forEach(g=>{g.t={x:g.n.y,y:-g.n.x};});
const POLY=[[C2,0],[FW-C2,0],[FW,C2],[FW,FH-C],[FW-C,FH],[C,FH],[0,FH-C],[0,C2]];
const EDGES=POLY.map((a,i)=>{const b=POLY[(i+1)%POLY.length],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy);
  return {ax:a[0],ay:a[1],nx:-dy/l,ny:dx/l,goal:-1};});
// 바깥이 아니라 안쪽을 향하도록 확인(시계 방향 다각형이라 (-dy,dx)가 안쪽)
EDGES.forEach(e=>{const d=(FW/2-e.ax)*e.nx+(FH/2-e.ay)*e.ny;if(d<0){e.nx*=-1;e.ny*=-1;}});
EDGES[0].goal=0;EDGES[5].goal=1;EDGES[3].goal=2;
const CENTER={x:FW/2,y:330};

const cv=$("cv"),ctx=cv.getContext("2d");
let scale=1,dpr=1;

/* ---------- 소리 ---------- */
let ac=null;
function initAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();}catch(e){ac=null;}}
function tone(f,t0,dur,type="square",vol=.08){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,ac.currentTime+t0);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t0+dur);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t0);o.stop(ac.currentTime+t0+dur+.02);}
let lastKick=0;
const sKick=()=>{const n=performance.now();if(n-lastKick<90)return;lastKick=n;tone(180,0,.08,"triangle",.18);};
const sWall=()=>tone(110,0,.05,"triangle",.08);
const sGoal=()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.18,"square",.07));
const sOops=()=>{tone(392,0,.15,"triangle",.1);tone(311,.15,.25,"triangle",.1);};
const sWhistle=()=>{tone(1800,0,.18,"sine",.06);tone(1800,.24,.35,"sine",.06);};

/* ---------- 상태 ---------- */
let players=[];
const ball={x:CENTER.x,y:CENTER.y,vx:0,vy:0,rot:0,last:null};
const ballRef={x:CENTER.x,y:CENTER.y};
let timeLeft=120,state="menu",stateT=0,goalInfo=null,stuckT=0,confetti=[],prevState="play";
const halfW=i=>GOALW*LEVELS[players[i]?players[i].lv:1].goal/2;

function makePlayers(){
  players=roster.map((r,i)=>{const g=GOALS[i];
    return {i,name:(r.name||"").trim()||CNAME[i],lv:r.lv,col:COLS[i],score:0,x:0,y:0,vx:0,vy:0,r:PR,face:Math.atan2(g.n.y,g.n.x),pid:null,tx:0,ty:0,
      hx:g.c.x+g.n.x*215,hy:g.c.y+g.n.y*215};});
  const S=$("score");S.querySelectorAll(".row").forEach(e=>e.remove());
  players.forEach(p=>{const d=document.createElement("div");d.className="row";d.innerHTML=`<i style="background:${p.col}"></i><span></span><b>0</b>`;d.querySelector("span").textContent=p.name;S.appendChild(d);p.el=d.querySelector("b");});
}
function kickoff(){
  players.forEach(p=>{p.x=p.hx;p.y=p.hy;p.vx=p.vy=0;p.pid=null;const g=GOALS[p.i];p.face=Math.atan2(g.n.y,g.n.x);});
  grabs.clear();
  ball.x=CENTER.x;ball.y=CENTER.y;ball.vx=ball.vy=0;ball.last=null;stuckT=0;ballRef.x=ball.x;ballRef.y=ball.y;
  state="ready";stateT=1.3;
}
function startGame(){
  roster.forEach((r,i)=>{r.name=$("nm"+i).value;});save();
  makePlayers();timeLeft=opt.time;confetti=[];
  $("menu").hidden=true;$("end").hidden=true;$("pause").hidden=true;$("pauseBtn").hidden=false;
  initAudio();sWhistle();kickoff();updateBoard();
}

/* ---------- 터치: 선수를 눌러야만 잡힘 ---------- */
const grabs=new Map();
function toWorld(e){const r=cv.getBoundingClientRect();return {x:VX+(e.clientX-r.left)/r.width*VW,y:VY+(e.clientY-r.top)/r.height*VH};}
cv.addEventListener("pointerdown",e=>{
  if(state!=="play"&&state!=="ready"&&state!=="goal")return;
  e.preventDefault();
  const w=toWorld(e);let best=null,bd=1e9;
  for(const p of players){if(p.pid!==null)continue;const d=Math.hypot(w.x-p.x,w.y-p.y);if(d<p.r+34&&d<bd){bd=d;best=p;}}
  if(!best)return;
  best.pid=e.pointerId;best.tx=w.x;best.ty=w.y;grabs.set(e.pointerId,best);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  initAudio();
});
cv.addEventListener("pointermove",e=>{const p=grabs.get(e.pointerId);if(!p)return;e.preventDefault();const w=toWorld(e);p.tx=w.x;p.ty=w.y;});
function release(e){const p=grabs.get(e.pointerId);if(p){p.pid=null;grabs.delete(e.pointerId);}}
cv.addEventListener("pointerup",release);cv.addEventListener("pointercancel",release);cv.addEventListener("lostpointercapture",release);
["touchstart","touchmove","gesturestart","contextmenu"].forEach(t=>cv.addEventListener(t,e=>e.preventDefault(),{passive:false}));

/* ---------- 물리 ---------- */
function confine(o,r){ // 선수는 골대 안으로 못 들어감
  for(const e of EDGES){const d=(o.x-e.ax)*e.nx+(o.y-e.ay)*e.ny;if(d<r){o.x+=e.nx*(r-d);o.y+=e.ny*(r-d);}}
}
function movePlayer(p,dt){
  const max=470*LEVELS[p.lv].spd;
  if(p.pid!==null&&state!=="goal"){
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
    const sp=Math.min(max,d*12),ux=d?dx/d:0,uy=d?dy/d:0;
    const a=Math.min(1,dt*16);p.vx+=(ux*sp-p.vx)*a;p.vy+=(uy*sp-p.vy)*a;
  }else{const a=Math.min(1,dt*7);p.vx-=p.vx*a;p.vy-=p.vy*a;}
  if(state==="ready"){p.vx=p.vy=0;}
  p.x+=p.vx*dt;p.y+=p.vy*dt;confine(p,p.r);
  if(Math.hypot(p.vx,p.vy)>40)p.face=Math.atan2(p.vy,p.vx);
}
function hitBall(p){
  const dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy),m=p.r+BR;
  if(d>=m||d===0)return;
  const nx=dx/d,ny=dy/d;ball.x=p.x+nx*m;ball.y=p.y+ny*m;
  const rel=(ball.vx-p.vx)*nx+(ball.vy-p.vy)*ny;
  if(rel<0){ball.vx-=1.5*rel*nx;ball.vy-=1.5*rel*ny;}
  const ps=Math.hypot(p.vx,p.vy);
  const power=(110+ps*0.6)*LEVELS[p.lv].kick;
  ball.vx+=nx*power*0.5;ball.vy+=ny*power*0.5;
  const bs=Math.hypot(ball.vx,ball.vy);if(bs>1000){ball.vx*=1000/bs;ball.vy*=1000/bs;}
  ball.last=p.i;
  if(ps>60||bs>200)sKick();
}
function bounceOff(nx,ny,k=1.8){const v=ball.vx*nx+ball.vy*ny;if(v<0){ball.vx-=k*v*nx;ball.vy-=k*v*ny;if(-v>80)sWall();}}
function post(px,py){
  const dx=ball.x-px,dy=ball.y-py,d=Math.hypot(dx,dy),m=BR+8;
  if(d<m&&d>0){const nx=dx/d,ny=dy/d;ball.x=px+nx*m;ball.y=py+ny*m;bounceOff(nx,ny);}
}
function moveBall(dt){
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  const f=Math.exp(-dt*(state==="goal"?5:0.85));ball.vx*=f;ball.vy*=f;
  ball.rot+=Math.hypot(ball.vx,ball.vy)*dt/BR;
  // 벽 (골문 구간은 통과, 골대 안에 들어간 공은 골대 그물만 적용)
  const inGoal=GOALS.some((g,gi)=>{const ox=ball.x-g.c.x,oy=ball.y-g.c.y;return ox*g.n.x+oy*g.n.y<0&&Math.abs(ox*g.t.x+oy*g.t.y)<halfW(gi);});
  if(!inGoal)for(const e of EDGES){
    const d=(ball.x-e.ax)*e.nx+(ball.y-e.ay)*e.ny;if(d>=BR)continue;
    if(e.goal>=0){const g=GOALS[e.goal],u=(ball.x-g.c.x)*g.t.x+(ball.y-g.c.y)*g.t.y;if(Math.abs(u)<halfW(e.goal))continue;}
    ball.x+=e.nx*(BR-d);ball.y+=e.ny*(BR-d);bounceOff(e.nx,e.ny);
  }
  // 골대 안
  GOALS.forEach((g,gi)=>{
    const h=halfW(gi),ox=ball.x-g.c.x,oy=ball.y-g.c.y,u=ox*g.t.x+oy*g.t.y,v=ox*g.n.x+oy*g.n.y;
    if(v<0&&Math.abs(u)<h+BR){
      let nu=Math.max(-h+BR,Math.min(h-BR,u)),nv=Math.max(-GD+BR,v);
      if(nu!==u||nv!==v){
        const vu=ball.vx*g.t.x+ball.vy*g.t.y,vv=ball.vx*g.n.x+ball.vy*g.n.y;
        const nvu=nu!==u?-vu*.5:vu,nvv=nv!==v?-vv*.3:vv;
        ball.x=g.c.x+g.t.x*nu+g.n.x*nv;ball.y=g.c.y+g.t.y*nu+g.n.y*nv;
        ball.vx=g.t.x*nvu+g.n.x*nvv;ball.vy=g.t.y*nvu+g.n.y*nvv;
      }
      if(v<-BR)goal(gi);
    }
    post(g.c.x+g.t.x*h,g.c.y+g.t.y*h);post(g.c.x-g.t.x*h,g.c.y-g.t.y*h);
  });
  // 벽 옆에서 4초 넘게 거의 제자리면 가운데로 굴려줌
  if(Math.hypot(ball.x-ballRef.x,ball.y-ballRef.y)>50){ballRef.x=ball.x;ballRef.y=ball.y;stuckT=0;}
  else{let near=1e9;for(const e of EDGES)near=Math.min(near,(ball.x-e.ax)*e.nx+(ball.y-e.ay)*e.ny);
    if(near<110&&near>0){stuckT+=dt;if(stuckT>4){ball.vx=(CENTER.x-ball.x)*0.9;ball.vy=(CENTER.y-ball.y)*0.9;stuckT=0;}}}
}
function collidePlayers(){
  for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){
    const a=players[i],b=players[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;
    if(d<m&&d>0){const p=(m-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p;}
  }
}
function goal(gi){
  if(state!=="play")return;
  const sc=ball.last;state="goal";stateT=2.4;
  if(sc!==null&&sc!==gi){
    players[sc].score++;goalInfo={own:false,who:sc,gi};sGoal();updateBoard();
    const g=GOALS[gi],col=[COLS[sc],"#FFD23F","#ffffff"];
    for(let i=0;i<120;i++){const a=Math.atan2(g.n.y,g.n.x)+(Math.random()-.5)*2.4,s=200+Math.random()*500;
      confetti.push({x:g.c.x,y:g.c.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-150,c:col[i%3],r:Math.random()*6.28,life:2+Math.random()});}
  }else{goalInfo={own:true,who:gi,gi};sOops();}
}

/* ---------- 그리기 ---------- */
function resize(){
  const box=$("fieldbox").getBoundingClientRect(),cs=getComputedStyle($("fieldbox"));
  const bw=box.width-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),bh=box.height-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const w=Math.max(200,Math.min(bw,bh*VW/VH)),h=w*VH/VW;dpr=Math.min(devicePixelRatio||1,2);
  cv.style.width=w+"px";cv.style.height=h+"px";cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);scale=w/VW;
}
addEventListener("resize",resize);
function polyPath(){ctx.beginPath();POLY.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();}
function drawGoal(g,gi){
  const h=halfW(gi),p=players[gi];
  // 내 구역 반원
  const a=Math.atan2(g.t.y,g.t.x);
  ctx.save();polyPath();ctx.clip();
  ctx.fillStyle=p.col+"33";ctx.beginPath();ctx.arc(g.c.x,g.c.y,h+70,a,a+Math.PI);ctx.closePath();ctx.fill();
  ctx.strokeStyle=p.col;ctx.lineWidth=4;ctx.beginPath();ctx.arc(g.c.x,g.c.y,h+70,a,a+Math.PI);ctx.stroke();
  ctx.restore();
  // 그물
  ctx.save();ctx.translate(g.c.x,g.c.y);ctx.transform(g.t.x,g.t.y,g.n.x,g.n.y,0,0);
  ctx.fillStyle="rgba(255,255,255,.16)";ctx.fillRect(-h,-GD,2*h,GD);
  ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=1.5;ctx.beginPath();
  for(let x=-h;x<=h;x+=11){ctx.moveTo(x,-GD);ctx.lineTo(x,0);}for(let y=0;y<=GD;y+=11){ctx.moveTo(-h,-y);ctx.lineTo(h,-y);}ctx.stroke();
  ctx.strokeStyle=p.col;ctx.lineWidth=8;ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(-h,0);ctx.lineTo(-h,-GD);ctx.lineTo(h,-GD);ctx.lineTo(h,0);ctx.stroke();
  ctx.fillStyle="#fff";[-h,h].forEach(x=>{ctx.beginPath();ctx.arc(x,0,8,0,7);ctx.fill();});
  ctx.restore();
  // 이름과 점수
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="rgba(255,255,255,.75)";
  ctx.font="22px Jua, sans-serif";ctx.fillText(p.name,g.c.x+g.n.x*40,g.c.y+g.n.y*40);
  ctx.font="46px Jua, sans-serif";ctx.fillText(String(p.score),g.c.x+g.n.x*88,g.c.y+g.n.y*88);
}
function drawPlayer(p,now){
  if(p.pid===null&&(state==="ready"||state==="play")){
    const pulse=(Math.sin(now/260+p.i)+1)/2;
    ctx.strokeStyle=`rgba(255,255,255,${0.25+pulse*0.3})`;ctx.lineWidth=3;ctx.setLineDash([8,8]);
    ctx.beginPath();ctx.arc(p.x,p.y,p.r+14+pulse*6,0,7);ctx.stroke();ctx.setLineDash([]);
  }
  if(p.pid!==null){ctx.fillStyle="rgba(255,255,255,.22)";ctx.beginPath();ctx.arc(p.x,p.y,p.r+18,0,7);ctx.fill();}
  ctx.fillStyle="rgba(0,0,0,.22)";ctx.beginPath();ctx.ellipse(p.x+4,p.y+9,p.r*1.02,p.r*.8,0,0,7);ctx.fill();
  ctx.fillStyle=p.col;ctx.strokeStyle="#fff";ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();ctx.stroke();
  const fx=Math.cos(p.face),fy=Math.sin(p.face),ex=-fy,ey=fx,o=p.r*.38,fw=p.r*.35;
  [-1,1].forEach(s=>{const cx=p.x+fx*fw+ex*o*s,cy=p.y+fy*fw+ey*o*s;
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(cx,cy,p.r*.22,0,7);ctx.fill();
    ctx.fillStyle="#1a1a1a";ctx.beginPath();ctx.arc(cx+fx*p.r*.08,cy+fy*p.r*.08,p.r*.11,0,7);ctx.fill();});
  ctx.font="26px Jua, sans-serif";ctx.textAlign="center";ctx.textBaseline="bottom";
  ctx.lineWidth=5;ctx.strokeStyle="rgba(0,0,0,.5)";ctx.strokeText(p.name,p.x,p.y-p.r-8);ctx.fillStyle="#fff";ctx.fillText(p.name,p.x,p.y-p.r-8);
}
function drawBall(){
  ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.ellipse(ball.x+4,ball.y+6,BR,BR*.75,0,0,7);ctx.fill();
  ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(ball.rot);
  ctx.fillStyle="#fff";ctx.strokeStyle="#222";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,BR,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle="#222";
  const pent=(cx,cy,r)=>{ctx.beginPath();for(let i=0;i<5;i++){const a=i*1.2566-1.57;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}ctx.closePath();ctx.fill();};
  pent(0,0,BR*.38);ctx.save();ctx.beginPath();ctx.arc(0,0,BR,0,7);ctx.clip();for(let i=0;i<5;i++){const a=i*1.2566-1.57;pent(Math.cos(a)*BR*.95,Math.sin(a)*BR*.95,BR*.3);}ctx.restore();
  ctx.restore();
}
function draw(now){
  ctx.setTransform(scale*dpr,0,0,scale*dpr,-VX*scale*dpr,-VY*scale*dpr);
  ctx.fillStyle="#256F39";ctx.fillRect(VX,VY,VW,VH);
  ctx.save();polyPath();ctx.clip();
  for(let i=0;i<10;i++){ctx.fillStyle=i%2?"#3A9A54":"#34914D";ctx.fillRect(i*FW/10,0,FW/10,FH);}
  ctx.restore();
  ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=5;polyPath();ctx.stroke();
  ctx.beginPath();ctx.arc(CENTER.x,CENTER.y,80,0,7);ctx.stroke();
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(CENTER.x,CENTER.y,6,0,7);ctx.fill();
  if(players.length)GOALS.forEach(drawGoal);
  drawBall();players.forEach(p=>drawPlayer(p,now));
  confetti.forEach(c=>{ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.fillStyle=c.c;ctx.globalAlpha=Math.min(1,c.life);ctx.fillRect(-6,-3,12,6);ctx.restore();});
  let big="",sub="",col="#fff";
  if(state==="ready")big=stateT>0.45?"준비":"시작!";
  if(state==="goal"&&goalInfo){
    if(goalInfo.own){big="앗!";sub=`${players[goalInfo.gi].name} 골대에 쏙. 점수는 없어요`;col="#FFE08A";}
    else{big="골~~~!";sub=`${players[goalInfo.who].name} 1점!`;col=COLS[goalInfo.who];}
  }
  if(big){
    ctx.textAlign="center";ctx.textBaseline="middle";ctx.font=`${state==="goal"?140:110}px Jua, sans-serif`;
    const t=state==="goal"?1+Math.sin(now/90)*0.04:1;
    ctx.save();ctx.translate(CENTER.x,CENTER.y-30);ctx.scale(t,t);
    ctx.lineWidth=14;ctx.strokeStyle="rgba(0,0,0,.45)";ctx.strokeText(big,0,0);ctx.fillStyle=col;ctx.fillText(big,0,0);ctx.restore();
    if(sub){ctx.font="46px Jua, sans-serif";ctx.lineWidth=10;ctx.strokeStyle="rgba(0,0,0,.45)";ctx.strokeText(sub,CENTER.x,CENTER.y+70);ctx.fillStyle="#fff";ctx.fillText(sub,CENTER.x,CENTER.y+70);}
  }
}

/* ---------- 점수판 ---------- */
const fmt=t=>{t=Math.max(0,Math.ceil(t));return `${Math.floor(t/60)}:${String(t%60).padStart(2,"0")}`;};
function updateBoard(){players.forEach(p=>{if(p.el)p.el.textContent=p.score;});$("clock").textContent=fmt(timeLeft);}
function endGame(){
  state="end";sWhistle();$("pauseBtn").hidden=true;grabs.clear();players.forEach(p=>p.pid=null);
  const order=players.slice().sort((a,b)=>b.score-a.score),top=order[0].score;
  const winners=order.filter(p=>p.score===top);
  $("endMsg").textContent=top===0?"아무도 못 넣었어요. 다시 해볼까?":winners.length>1?`${winners.map(p=>p.name).join(", ")} 공동 1등!`:`${winners[0].name} 1등! 모두 잘했어요!`;
  let rank=0,prev=null;
  $("final").innerHTML=order.map((p,k)=>{if(p.score!==prev){rank=k+1;prev=p.score;}return `<div><i style="background:${p.col}"></i><span>${rank}등 ${p.name.replace(/</g,"&lt;")}</span><b>${p.score}</b></div>`;}).join("");
  if(top>0)for(let i=0;i<160;i++)confetti.push({x:Math.random()*FW,y:-20,vx:(Math.random()-.5)*200,vy:Math.random()*200,c:[winners[0].col,"#FFD23F","#fff"][i%3],r:Math.random()*6,life:3+Math.random()*2});
  setTimeout(()=>{if(state==="end")$("end").hidden=false;},900);
}
function setPause(on){
  if(on){prevState=state;state="paused";grabs.clear();players.forEach(p=>p.pid=null);$("pause").hidden=false;}
  else{state=prevState;$("pause").hidden=true;}
}

/* ---------- 루프 ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(state==="ready"){stateT-=dt;if(stateT<=0)state="play";}
  if(state==="play"||state==="ready"||state==="goal"||state==="end"){
    if(state==="play"){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;updateBoard();endGame();}}
    players.forEach(p=>movePlayer(p,dt));collidePlayers();
    if(state==="play")players.forEach(hitBall);
    if(state!=="ready")moveBall(dt);
    if(state==="goal"){stateT-=dt;if(stateT<=0)kickoff();}
  }
  if(state!=="paused"){confetti.forEach(c=>{c.vy+=500*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vx*=.99;c.r+=dt*8;c.life-=dt;});confetti=confetti.filter(c=>c.life>0);}
  if(state==="play")$("clock").textContent=fmt(timeLeft);
  draw(now);requestAnimationFrame(frame);
}

/* ---------- 메뉴 ---------- */
function renderRows(){
  const R=$("rows");R.innerHTML="";
  roster.forEach((r,i)=>{
    const d=document.createElement("div");d.className="prow";d.style.borderLeftColor=COLS[i];
    d.innerHTML=`<input id="nm${i}" maxlength="6" aria-label="${CNAME[i]} 선수 이름"><div class="seg" role="group" aria-label="난이도">${LEVELS.map((L,k)=>`<button type="button" data-k="${k}" class="${r.lv===k?"on":""}">${L.n}</button>`).join("")}</div><span class="where">${CNAME[i]} · ${WHERE[i]}</span>`;
    const inp=d.querySelector("input");inp.value=r.name;inp.addEventListener("input",()=>{r.name=inp.value;});
    d.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{r.lv=+b.dataset.k;save();renderRows();}));
    R.appendChild(d);
  });
  makePlayers();kickoffPreview();
}
function kickoffPreview(){players.forEach(p=>{p.x=p.hx;p.y=p.hy;});ball.x=CENTER.x;ball.y=CENTER.y;}
{const el=$("optTime");el.querySelectorAll("button").forEach(b=>{b.classList.toggle("on",+b.dataset.v===opt.time);
  b.addEventListener("click",()=>{opt.time=+b.dataset.v;el.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));save();});});}
$("startBtn").addEventListener("click",startGame);
$("againBtn").addEventListener("click",()=>{$("end").hidden=true;players.forEach(p=>p.score=0);timeLeft=opt.time;confetti=[];$("pauseBtn").hidden=false;sWhistle();kickoff();updateBoard();});
$("menuBtn").addEventListener("click",()=>{state="menu";$("end").hidden=true;$("menu").hidden=false;renderRows();});
$("quitBtn").addEventListener("click",()=>{state="menu";$("pause").hidden=true;$("pauseBtn").hidden=true;$("menu").hidden=false;renderRows();});
$("resumeBtn").addEventListener("click",()=>setPause(false));
$("pauseBtn").addEventListener("click",()=>{if(state==="play"||state==="ready"||state==="goal")setPause(true);});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&(state==="play"||state==="ready"))setPause(true);});
addEventListener("keydown",e=>{if(e.key==="Escape"){if(state==="paused")setPause(false);else if(state==="play"||state==="ready")setPause(true);}});

resize();renderRows();timeLeft=opt.time;updateBoard();requestAnimationFrame(frame);
window.__s3={get state(){return state},players:()=>players,ball,goals:GOALS,halfW,toScreen:(x,y)=>{const r=cv.getBoundingClientRect();return {x:r.left+(x-VX)/VW*r.width,y:r.top+(y-VY)/VH*r.height};}};
})();
</script>
